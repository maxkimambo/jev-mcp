name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # jev_search shells out to ripgrep.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      # Dependency install scripts stay blocked; this package needs none.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      # The plugin runs the committed bundle, so it must match the source.
      - run: git diff --exit-code bundle/
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
